<!doctype html><html lang="en"><meta charset="utf-8"><title>Held Shield of Mobility</title><style>body{background:#292d32;color:#eee;font:16px system-ui;padding:24px}img{image-rendering:pixelated;background:#74787c}.icon{width:288px;height:192px}main{display:flex;gap:16px;flex-wrap:wrap}section img{width:192px;height:306px}.attack img{width:252px}.sheet{width:504px;height:1224px}</style><h1>Shield of Mobility — rounded feather shield</h1><p>18-frame visual candidate. Native 32-pixel shield height; original square-shield centers and canvas bounds. Not installed; grip alignment still needs in-game validation.</p><img class="icon" src="../shield-of-mobility-approved.png"><main></main><details><summary>All frames</summary><img class="sheet" src="contact.png"></details><script>const imgs=[];['Front','Diagonal front','Side','Diagonal rear','Rear','Combat'].forEach((label,g)=>{const s=document.createElement('section');if(g===5)s.className='attack';s.innerHTML='<h2>'+label+'</h2><img>';document.querySelector('main').append(s);imgs.push(s.querySelector('img'))});let t=0;function draw(){imgs.forEach((im,g)=>im.src='full-canvas/frame-'+String(g*3+(g===5?[0,1,2,1]:[0,1,0,2])[t%4]).padStart(2,'0')+'.png');t++}draw();setInterval(draw,300);</script></html>
