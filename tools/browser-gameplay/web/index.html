<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Spoiled Milk</title>
<style>
html,body{margin:0;height:100%;background:#101820;color:#eee;font:16px system-ui}#player{height:100dvh;position:relative;background:#000}#session{position:absolute;inset:0}iframe{width:100%;height:100%;border:0;display:block}button{padding:10px 18px;margin:5px;font:inherit;cursor:pointer}button:disabled{cursor:default}#welcome{position:absolute;inset:0;z-index:30;background:#101820;display:grid;place-items:center;text-align:center;padding:20px;box-sizing:border-box}#welcome[hidden]{display:none}.card{max-width:440px}#status{line-height:1.5}body[data-view=embedded] #session{height:620px;max-width:1100px;width:100%;margin:auto;top:50%;transform:translateY(-50%)}#player:fullscreen{height:100%;width:100%}#player:fullscreen #session{height:100%;max-width:none;transform:none;top:0}dialog{background:#182026;color:#eee;border:1px solid #607280;border-radius:6px;max-width:400px;text-align:center}dialog::backdrop{background:#0009}
</style>
<main id="player">
<div id="session"></div>
<section id="welcome" aria-labelledby="welcome-title"><div class="card">
<h1 id="welcome-title">Spoiled Milk</h1><p id="release-label" hidden></p><p id="status" role="status">Ready to play.</p>
<button id="start" type="button">Play</button><button id="stop" type="button" hidden disabled>Cancel</button>
<p id="download-client" hidden><a href="https://rscspoiledmilk.com/" target="_blank" rel="noopener noreferrer">Download client</a></p>
<p id="runtime-credit" hidden>Java runtime powered by <a href="https://cheerpj.com/" target="_blank" rel="noopener noreferrer">CheerpJ by Leaning Technologies</a>.</p>
</div></section>
<dialog id="display-confirm" aria-labelledby="display-title"><h2 id="display-title">Fullscreen</h2><p id="display-message"></p><button id="display-enter" type="button">Enter fullscreen</button><button id="display-cancel" type="button">Keep playing in tab</button></dialog>
</main>
<script type="module" src="./session.js"></script>
</html>
