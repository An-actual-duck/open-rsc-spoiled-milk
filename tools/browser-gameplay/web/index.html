<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Spoiled Milk</title>
<style>
html,body{margin:0;height:100%;background:#101820;color:#eee;font:16px system-ui}#player{height:100dvh;position:relative;background:#000}#session{position:absolute;inset:0}iframe{width:100%;height:100%;border:0;display:block}button{padding:10px 18px;margin:5px;font:inherit;cursor:pointer}button:disabled{cursor:default}#welcome{position:absolute;inset:0;z-index:30;background:#101820;display:grid;place-items:center;text-align:center;padding:20px;box-sizing:border-box}#welcome[hidden]{display:none}.card{max-width:440px}#status{line-height:1.5}#startup-progress{width:100%;height:12px;accent-color:#83b5d1}#startup-detail{font-size:.9rem;color:#bdcbd3;min-height:1.4em}#startup-progress[hidden],#startup-detail[hidden]{display:none}body[data-view=embedded] #session{height:620px;max-width:1100px;width:100%;margin:auto;top:50%;transform:translateY(-50%)}#player:fullscreen{height:100%;width:100%}#player:fullscreen #session{height:100%;max-width:none;transform:none;top:0}dialog{background:#182026;color:#eee;border:1px solid #607280;border-radius:6px;max-width:400px;text-align:center}dialog::backdrop{background:#0009}
</style>
<style>
.loading-choices{display:grid;gap:16px;width:min(100%,340px);margin:20px auto}
.loading-choices[hidden]{display:none}
.loading-choice button{display:block;width:100%;margin:0;padding:12px 16px;background:#243949;color:#f4f7f8;border:1px solid #658498;border-radius:5px}
.loading-choice button:hover{background:#314c60}
.loading-choice button:focus-visible{outline:2px solid #acd5ed;outline-offset:3px}
.loading-choice p{margin:7px 0 0;color:#c6d3db;font-size:.9rem;line-height:1.4}
</style>
<main id="player">
<div id="session"></div>
<section id="welcome" aria-labelledby="welcome-title"><div class="card">
<h1 id="welcome-title">Spoiled Milk</h1><p id="release-label" hidden></p><p id="status" role="status">Ready to play.</p>
<progress id="startup-progress" aria-label="Starting game" hidden></progress><p id="startup-detail" hidden></p>
<div id="loading-choices" class="loading-choices" hidden>
  <div class="loading-choice"><button id="play-chunks" type="button" aria-describedby="chunks-description">Play with World Chunks</button>
    <p id="chunks-description">Use the familiar loading mode. You may see brief pauses when entering new areas.</p></div>
  <div class="loading-choice"><button id="play-streaming" type="button" aria-describedby="streaming-description">Play with World Streaming</button>
    <p id="streaming-description">Try the new mode. It prepares nearby areas as you walk for smoother travel.</p></div>
</div>
<button id="start" type="button">Play</button><button id="stop" type="button" hidden disabled>Cancel</button>
<p id="download-client" hidden><a href="https://rscspoiledmilk.com/" target="_blank" rel="noopener noreferrer">Download client</a></p>
<p id="runtime-credit"><a href="https://cheerpj.com/" target="_blank" rel="noopener noreferrer">Built with CheerpJ</a></p>
</div></section>
<dialog id="display-confirm" aria-labelledby="display-title"><h2 id="display-title">Fullscreen</h2><p id="display-message"></p><button id="display-enter" type="button">Enter fullscreen</button><button id="display-cancel" type="button">Keep playing in tab</button></dialog>
</main>
<script type="module" src="./session.js"></script>
</html>
