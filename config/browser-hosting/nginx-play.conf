# Install as one nginx sites-available file, then nginx -t before reload.
# HTTPS static files only. WSS is direct to the game on43505, never reverse-proxied.
server {
    listen 80;
    server_name play.rscspoiledmilk.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/spoiled-milk/acme;
        try_files $uri =404;
    }
    location / { return 301 https://play.rscspoiledmilk.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name play.rscspoiledmilk.com;
    ssl_certificate /etc/letsencrypt/live/play.rscspoiledmilk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/play.rscspoiledmilk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PLAYTLS:2m;
    if ($host != play.rscspoiledmilk.com) { return 444; }
    root /srv/spoiled-milk-browser/current;
    index index.html;
    autoindex off;
    etag on;
    max_ranges 1;
    sendfile on;
    gzip off;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json;
        application/java-archive jar;
        application/wasm wasm;
        image/png png;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ~ /\. { deny all; }
    location ^~ /assets/ {
        # Each build ID is a stable symlink to its immutable release/assets/ID.
        # Keep old IDs reachable when current changes, so existing sessions finish.
        root /srv/spoiled-milk-browser;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        limit_except GET { deny all; }
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        limit_except GET { deny all; }
    }
}
